<script>
'use strict';
const DAY = 86400000;
const KEY = 'fdladder.v1';
const parseISO = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || '')); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN; };
const isoOf = (ms) => new Date(ms).toISOString().slice(0, 10);
const fmtDate = (ms) => new Date(ms).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
const fL = (x) => { const a = Math.abs(x), s = x < 0 ? '−' : ''; return a >= 100 ? s + '₹' + (a / 100).toFixed(2) + ' Cr' : s + '₹' + a.toFixed(1) + ' L'; };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function EXAMPLE() {
  const fd = (days, rate) => ({ on: true, provider: 'ICICI Bank', type: 'FD', days, rate, pen: 1 });
  const tb = (days, rate) => ({ on: false, provider: 'Govt of India T-Bills', type: 'TBILL', days, rate, pen: 0.1 });
  return {
    startDate: '2026-10-14', opening: 1000, buffer: 40, planDays: 365, scenario: 'stress', delay: 0,
    review: 15, minTicket: 5, lot: 1, tax: 25.17,
    providers: [{ name: 'ICICI Bank', cap: 0 }, { name: 'Govt of India T-Bills', cap: 0 }],
    fds: [{ label: 'Existing FD', provider: 'ICICI Bank', amt: 100, rate: 6, start: '2026-07-14', mat: '2027-01-14' }],
    flows: [
      { name: 'Operating outflows (salaries, admin, vendors)', type: 'out', amt: 30, pct: 20, days: 'last2', conc: 80, months: 'all' },
      { name: 'Customer receipts', type: 'in', amt: 10, pct: 20, days: '12-18', conc: 80, months: 'all' }
    ],
    inst: [fd(30, 4.5), fd(60, 4.75), fd(91, 5.25), fd(120, 5.5), fd(185, 5.75), fd(271, 6.0), fd(365, 6.25), fd(540, 6.5),
      tb(91, 5.5747), tb(182, 6.0999), tb(364, 6.2869)]
  };
}
const STAT_ROWS = () => [
  { name: 'GST payment (GSTR-3B)', type: 'out', amt: 8, pct: 20, days: '20', conc: 100, months: 'all' },
  { name: 'TDS deposit', type: 'out', amt: 3, pct: 10, days: '7', conc: 100, months: 'all' },
  { name: 'PF / EPFO', type: 'out', amt: 2.5, pct: 5, days: '15', conc: 100, months: 'all' },
  { name: 'Advance tax instalment', type: 'out', amt: 25, pct: 10, days: '15', conc: 100, months: '3,6,9,12' },
  { name: 'Capex and events', type: 'out', amt: 15, pct: 30, days: '20-28', conc: 70, months: '2,5,8,11' }
];

/* ---------- calendar and events ---------- */
function buildCal(S) {
  const s = parseISO(S.startDate); const sd = new Date(s);
  const first = Date.UTC(sd.getUTCFullYear(), sd.getUTCMonth(), 1);
  const off = Math.round((s - first) / DAY);
  const maxT = Math.max(30, ...S.inst.filter((i) => i.on && +i.days > 0).map((i) => Math.min(1100, +i.days)));
  const N = S.planDays + maxT + 2, M = off + N + 45;
  const y0 = sd.getUTCFullYear(), m0 = sd.getUTCMonth();
  const cal = { s, first, off, N, M, m: [], d: [], dim: [], mk: [], wd: [], blocks: {} };
  for (let i = 0; i < M; i++) {
    const dt = new Date(first + i * DAY), y = dt.getUTCFullYear(), m = dt.getUTCMonth(), dow = dt.getUTCDay();
    cal.m[i] = m; cal.d[i] = dt.getUTCDate(); cal.dim[i] = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    cal.mk[i] = (y - y0) * 12 + (m - m0); cal.wd[i] = dow > 0 && dow < 6;
    (cal.blocks[cal.mk[i]] || (cal.blocks[cal.mk[i]] = [])).push(i);
  }
  return cal;
}
const isoTok = (t) => /^\d{4}-\d{2}-\d{2}$/.test(t);
/* A flow is one-time when its freq says so; older rows marked a one-off by putting a date in Days. */
const isOnce = (f) => f.freq ? f.freq === 'once' : isoTok(String(f.days || '').trim());
const onceDate = (f) => f.date || (isoTok(String(f.days || '').trim()) ? String(f.days).trim() : '');
function buildEvents(S, cal) {
  return S.flows.map((f) => {
    const ev = [], toks = String(f.days || '').split(',').map((x) => x.trim()).filter(Boolean);
    const conc = Math.min(100, Math.max(0, +f.conc || 0)) / 100;
    const ms = String(f.months || 'all').trim().toLowerCase();
    const mset = (ms === 'all' || ms === '') ? null : new Set(ms.split(/[ ,]+/).map(Number));
    const push = (i, w, mk) => { const t = i - cal.off; if (t >= 0 && t < cal.N && w > 0) ev.push({ t, w, mk }); };
    const once = isOnce(f), isos = once ? [onceDate(f)].filter(isoTok) : toks.filter(isoTok);
    if (once || isos.length) {
      isos.forEach((t) => { const i = Math.round((parseISO(t) - cal.first) / DAY); if (i >= 0 && i < cal.M) push(i, 1, cal.mk[i]); });
    } else {
      const maxMk = cal.mk[cal.M - 1];
      for (let k = 0; k <= maxMk; k++) {
        const blk = cal.blocks[k]; if (!blk || !blk.length) continue;
        if (mset && !mset.has(cal.m[blk[0]] + 1)) continue;
        const wds = blk.filter((i) => cal.wd[i]); if (!wds.length) continue;
        const dim = cal.dim[blk[0]], tg = new Set();
        toks.forEach((tok) => {
          let mt;
          if ((mt = tok.match(/^last(\d*)$/i))) { wds.slice(-Math.max(1, +mt[1] || 1)).forEach((i) => tg.add(i)); }
          else if ((mt = tok.match(/^(\d+)\s*-\s*(\d+)$/))) {
            const a = +mt[1], b = +mt[2], sel = wds.filter((i) => cal.d[i] >= a && cal.d[i] <= b);
            if (sel.length) sel.forEach((i) => tg.add(i)); else tg.add(wds.find((i) => cal.d[i] >= a) || wds[wds.length - 1]);
          } else if (/^\d+$/.test(tok)) {
            let i = blk[Math.min(+tok, dim) - 1]; while (i < cal.M && !cal.wd[i]) i++; if (i < cal.M) tg.add(i);
          }
        });
        const tl = [...tg], c = tl.length ? conc : 0, wm = new Map();
        tl.forEach((i) => wm.set(i, (wm.get(i) || 0) + c / tl.length));
        wds.forEach((i) => wm.set(i, (wm.get(i) || 0) + (1 - c) / wds.length));
        wm.forEach((w, i) => push(i, w, k));
      }
    }
    return { f, ev };
  });
}
function specFor(name, S) {
  if (name === 'base') return { outFac: () => 1, inFac: () => 1, delay: 0 };
  if (name === 'opt') return { outFac: (p) => 1 - p, inFac: (p) => 1 + p, delay: 0 };
  return { outFac: (p) => 1 + p, inFac: (p) => 1 - p, delay: Math.max(0, Math.round(+S.delay || 0)) };
}
function flowsFor(evs, spec, N) {
  const inF = new Float64Array(N), outF = new Float64Array(N);
  evs.forEach((c) => {
    const f = c.f, pct = (+f.pct || 0) / 100, amt = +f.amt || 0, isOut = f.type === 'out';
    const fac = isOut ? spec.outFac(pct) : spec.inFac(pct), arr = isOut ? outF : inF, sh = isOut ? 0 : (spec.delay || 0);
    for (const e of c.ev) { const t = e.t + sh; if (t >= 0 && t < N) arr[t] += amt * e.w * fac; }
  });
  (spec.extra || []).forEach((x) => { if (x.t >= 0 && x.t < N) (x.type === 'in' ? inF : outF)[x.t] += x.amt; });
  return { inF, outF };
}
function existingMat(S, cal) {
  const mat = new Float64Array(cal.N);
  S.fds.forEach((f) => {
    f.t = null; f.val = null;

  const ev0 = windowStats(M, M.ev, 0, H), gap = ev0.min0 < S.buffer - 1e-6;
  if (gap) head.push(`Within these ${H} days your forecast runs short on its own: with no new FDs, the stressed balance falls to ${fL(ev0.min0)} on ${fmtDate(cal.s + ev0.min0T * DAY)}, against a ${fL(S.buffer)} buffer. No deposit plan can create the missing cash, so each strategy is judged on whether it makes the account worse off than doing nothing on any day.`);
  if (plan.n === 0) { trouble = true; head.push(`The ladder opens no deposits, so it earns nothing. Either no rate row is ticked in Inputs, or the stressed balance leaves no room above the ${fL(S.buffer)} buffer.`); }
  else if (planOk && gap) head.push(`The ladder earns ${fL(plan.accr)} and never leaves the account lower than doing nothing would. Its deposits pay back before the cash is needed, so the interest it earns slightly reduces the shortfall.`);
  else if (planOk) head.push(`The ladder earns ${fL(plan.accr)}. Its lowest stressed balance is ${fL(plan.min)} against a buffer of ${fL(S.buffer)}${room < 2 ? ', so it uses the cash right down to the safety line and no further' : ', which leaves ' + fL(room) + ' of headroom'}.`);

  if (bestSafe && plan.n > 0) {

    <ul>${stressList || '<li>No flows entered.</li>'}</ul></div></div>
  <div class="sec"><h3>What each column means</h3>
    <dl class="defs">

      <div><dt>Lowest balance</dt><dd>The lowest the current account gets on any day within the planning horizon, with that strategy's deposits locked, your existing FDs paying back on their dates and the stressed flows applied. A negative figure means the account would be overdrawn. The date shown is the day of that low.</dd></div>

/* Cash position: label-value pairs anywhere in the workbook, or a statement with Date and Balance columns. */

/* Existing FDs: one row per deposit under a header row. */
const FD_SPEC = {

  mat: [/matur|due ?date|end ?date|expiry|redemption ?date/, /amount|amt|value|proceeds|interest|instruction/],
  start: [/(start|open|opened|opening|book|booking|placement|value|issue|invest|investment|deposit|effective) ?(date|dt|on)\b|^(start|opened|from|date)$|date of (deposit|investment|booking|opening|issue)/, /matur/],
  days: [/tenure|term|period|days|duration/, /date|rate/],
  rate: [/rate|roi|yield|coupon|% ?p ?a|interest ?%|^int ?%/, /amount|amt|value|date|payout|freq|type/],
  provider: [/bank|provider|issuer|institution|counterparty|lender/, /account|a c|ifsc|number|no$|branch|date|code/],
  label: [/label|fd ?(no|number|id|ref|a c|account)|deposit ?(no|number|id|ref|account)|receipt ?(no|number)|account ?(no|number)|reference|ref ?no|^name$|description|^id$|particulars/],

function importFDs(sheets, taken) {
  const T = findTable(sheets, FD_SPEC, (m) => m.amt != null && (m.mat != null || m.days != null), taken);
  if (!T) return { ok: false, html: 'No FD table found. It needs a header row with at least an amount column (Principal, Amount) and a Maturity date or Tenure column.' };
  blockRows(T, taken);
  const g = (row, k) => (T.map[k] == null ? null : row[T.map[k]]), au = colInfo(T, 'amt'), mvu = T.map.matv != null ? colInfo(T, 'matv') : au;

    if (!n) return provs[0] ? provs[0].name : 'Bank';

/* ---------- review step and bank statement history ----------
   Imports are shown for review first and applied only on request. Statement history is turned into recurring flows by rules:
   lines are grouped by their description, then each group's size, spread and timing are measured month by month. */
const pending = {};
const r2 = (x) => Math.round(x * 100) / 100;
const cashShow = (k, v) => (k === 'startDate' ? fmtDate(parseISO(v)) : k === 'tax' ? v + '%' : /^(opening|buffer|minTicket|lot)$/.test(k) ? fL(+v) : v + ' days');

function flowsPending(out, head, extraHtml, showSrc) {
  const s0 = parseISO(S.startDate), past = out.filter((f) => f.freq === 'once' && parseISO(f.date) < s0).length;
  const rows = out.map((f) => `<tr><td>${esc(f.name)}</td><td>${f.type === 'in' ? 'Inflow' : 'Outflow'}</td><td class="n">${fL(f.amt)}</td><td class="n">±${f.pct}%</td><td>${esc(timingText(f))}</td>${showSrc ? `<td class="small">${esc(f.src || '')}</td>` : ''}</tr>`).join('');
  return { pending: {
    html: `<b>${head}. Check them, then apply.</b> They will ${impMode.flows === 'add' ? 'be added to' : 'replace'} the inflows and outflows table.<div class="card scroll"><table class="tbl"><thead><tr><th>Event</th><th>Type</th><th class="n">Amount</th><th class="n">Band</th><th>Timing</th>${showSrc ? '<th>Where</th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>${past ? `<p>${plural(past, 'one-time event')} ${past === 1 ? 'falls' : 'fall'} before the forecast start (${fmtDate(s0)}) and will have no effect.</p>` : ''}${extraHtml || ''}`,
    apply: () => { const rows2 = out.map(({ src, ...f }) => f); S.flows = impMode.flows === 'add' ? S.flows.concat(rows2) : rows2; },
    done: `Applied ${plural(out.length, 'inflow and outflow row')}.` } };
}
/* 2. Forecasting flows from bank statement history: group the lines, then measure size, spread and timing month by month. */
const CATS = [[/salar|payroll|wages|stipend/, 'Salaries and wages'], [/\bgst|gstr|cgst|sgst|igst/, 'GST payments'], [/\btds\b|income ?tax|advance tax|itns|\bcbdt/, 'Income tax and TDS'],
  [/\bepf|\bpf\b|provident|esic|\besi\b/, 'PF and ESI'], [/\brent\b|lease/, 'Rent'], [/electric|power|water|utility|bescom|msedcl|tneb|tata power/, 'Utilities'],
  [/\bemi\b|loan|interest (debit|charged)|int\.? ?dr/, 'Loan repayments and interest'], [/insurance|premium/, 'Insurance']];
const EXCL = /\bfd\b|fixed dep|term dep|\btd\b ?(booking|closure|matur)|sweep|own a\/?c|own account|self transfer|inter ?(a\/?c|account|company)|\bto self\b|\bfd ?(no|book|matur)/;
const STOP = /\b(neft|rtgs|imps|upi|ach|nach|ecs|cms|trf|tfr|transfer|by|to|from|ref|inb|mb|ib|chq|cheque|clg|dr|cr|txn|payment|paid|received|a\/c|ac|no|the|and|for|pvt|ltd|limited|private|india|bank|hdfc|icici|sbi|axis|kotak)\b/g;
function descKey(s) {
  const t = String(s).toLowerCase(), c = CATS.find(([re]) => re.test(t)); if (c) return c[1];
  const w = t.replace(/[0-9]+/g, ' ').replace(STOP, ' ').replace(/[^a-z ]/g, ' ').split(/\s+/).filter((x) => x.length > 2).slice(0, 2).join(' ');
  return w ? w.replace(/\b\w/g, (ch) => ch.toUpperCase()) : 'Other';
}
function statementTxns(sheets) {
  const spec = { date: FLOW_SPEC.date, type: FLOW_SPEC.type, inAmt: FLOW_SPEC.inAmt, outAmt: FLOW_SPEC.outAmt, bal: [/balance/], amt: FLOW_SPEC.amt, name: FLOW_SPEC.name };
  const T = findTable(sheets, spec, (m) => m.date != null && (m.amt != null || m.inAmt != null || m.outAmt != null)); if (!T) return null;
  const g = (row, k) => (T.map[k] == null ? null : row[T.map[k]]), u = {};

  ['inAmt', 'outAmt', 'amt'].forEach((k) => { if (T.map[k] != null) u[k] = headUnit(normH(T.head[T.map[k]])) || 'rs'; });
  const L = (c, k) => Math.abs(c.n) * (UNIT[c.u && c.u !== '%' ? c.u : u[k]] || 1e-5), txns = [];
  T.rows.slice(T.r + 1).forEach((row) => {

    const desc = txt(g(row, 'name')) || '(no description)', ci = cellNum(g(row, 'inAmt')), co = cellNum(g(row, 'outAmt'));
    if (ci && ci.n) txns.push({ d, desc, a: L(ci, 'inAmt') });
    if (co && co.n) txns.push({ d, desc, a: -L(co, 'outAmt') });
    if (!(ci && ci.n) && !(co && co.n) && T.map.amt != null) {
      const c = cellNum(g(row, 'amt')); if (!c || !c.n) return;

}
const wdAfter = (iso) => { const t = new Date(parseISO(iso)), y = t.getUTCFullYear(), m = t.getUTCMonth(), dim = new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); let n = 0; for (let d = t.getUTCDate() + 1; d <= dim; d++) { const w = new Date(Date.UTC(y, m, d)).getUTCDay(); if (w > 0 && w < 6) n++; } return n; };
/* The narrowest timing rule that holds 90% of the money (so weekend slips stay inside it), else the narrowest holding 70%;
   with no clear cluster the flow is spread over the month. */
function timingOf(txns) {
  const list = txns.map((t) => ({ day: +t.d.slice(8), wa: wdAfter(t.d), w: Math.abs(t.a) })), tot = list.reduce((s, x) => s + x.w, 0); if (!tot) return { days: '', conc: 0 };
  const share = (f) => list.filter(f).reduce((s, x) => s + x.w, 0) / tot, cands = [];
  for (let n = 1; n <= 3; n++) cands.push({ days: 'last' + (n > 1 ? n : ''), width: n * 1.4, share: share((x) => x.wa < n) });
  for (let a = 1; a <= 31; a++) for (let b = a; b <= Math.min(31, a + 6); b++) cands.push({ days: a === b ? String(a) : a + '-' + b, width: b - a + 1, share: share((x) => x.day >= a && x.day <= b) });
  const narrowest = (min) => cands.filter((c) => c.share >= min).sort((p, q) => p.width - q.width || q.share - p.share)[0];

function historyForecast(sheets) {
  const st = statementTxns(sheets);
  if (!st || st.txns.length < 10) return { ok: false, html: 'No bank statement found. The sheet needs a header row with a Date column, a Description or Narration column, and either Withdrawal and Deposit (Debit and Credit) columns or one signed Amount column.' };
  const mkOf = (iso) => +iso.slice(0, 4) * 12 + (+iso.slice(5, 7) - 1), ds = st.txns.map((t) => t.d).sort(), first = ds[0], last = ds[ds.length - 1];
  let m0 = mkOf(first), m1 = mkOf(last);
  if (+first.slice(8) > 5) m0++;

    const dir = t.a >= 0 ? 'in' : 'out', ex = EXCL.test(t.desc.toLowerCase()), label = ex ? 'FD and own-account transfers' : descKey(t.desc), k = dir + '|' + label;
    if (!rule.has(k)) rule.set(k, { label, dir, txns: [], excl: ex, why: ex ? 'Excluded: FD or own-account transfer' : '' });

  const med = (a) => { const s = a.slice().sort((p, q) => p - q), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
  const out = [], report = [];
  groups.sort((p, q) => q.txns.reduce((s, t) => s + Math.abs(t.a), 0) - p.txns.reduce((s, t) => s + Math.abs(t.a), 0)).forEach((gr) => {
    const tot = gr.txns.reduce((s, t) => s + Math.abs(t.a), 0), per = new Map();
    gr.txns.forEach((t) => per.set(mkOf(t.d), (per.get(mkOf(t.d)) || 0) + Math.abs(t.a)));
    const vals = [...per.values()], k = vals.length, cms = [...per.keys()].map((x) => (x % 12) + 1);
    const row = { label: gr.label, dir: gr.dir, lines: gr.txns.length, seen: `${k} of ${N}`, tot, decision: '', flow: null };
    if (gr.excl) { row.decision = gr.why; report.push(row); return; }
    let months = null;
    if (k / N >= 0.6) months = 'all';
    else if (k >= 2 && cms.every((m) => (m - cms[0] + 12) % 3 === 0) && k / (N / 3) >= 0.6) months = everyN(cms[0], 3);
    if (!months) { row.decision = `Not forecast: irregular (${fL(tot)} in total). Add it as a one-time event if it will recur.`; report.push(row); return; }
    const m = med(vals), band = Math.min(100, Math.max(5, Math.round(Math.max(...vals.map((v) => Math.abs(v - m) / m)) * 20) * 5)), tm = timingOf(gr.txns);
    row.flow = { name: gr.label + ' (from history)', type: gr.dir, freq: 'monthly', date: '', amt: r2(m), pct: band, days: tm.days, conc: tm.conc, months };
    row.decision = months === 'all' ? 'Forecast monthly' : 'Forecast quarterly';
    out.push(row.flow); report.push(row);

  if (!out.length) return { ok: false, html: `Read ${plural(tx.length, 'line')} (${span}), but no category recurred often enough to forecast.` };
  const rep = report.map((r) => `<tr><td>${esc(r.label)}</td><td>${r.dir === 'in' ? 'In' : 'Out'}</td><td class="n">${r.lines}</td><td class="n">${r.seen}</td><td class="n">${r.flow ? fL(r.flow.amt) : '—'}</td><td class="n">${r.flow ? '±' + r.flow.pct + '%' : '—'}</td><td>${r.flow ? esc(timingText(r.flow)) : '—'}</td><td class="small">${esc(r.decision)}</td></tr>`).join('');
  const p = flowsPending(out, `Built ${plural(out.length, 'recurring row')} from ${plural(tx.length, 'statement line')} over ${N} full months (${span}), grouped by description`,
    `<p>How each category was treated:</p><div class="card scroll"><table class="tbl"><thead><tr><th>Category</th><th>Dir.</th><th class="n">Lines</th><th class="n">Months seen</th><th class="n">Typical / month</th><th class="n">Band</th><th>Timing</th><th>Decision</th></tr></thead><tbody>${rep}</tbody></table></div>
    <p>Typical amount is the median month. The band is the widest monthly swing from it, so the stress forecast covers the worst month seen. Past statements cannot show late receipts or planned changes such as new hires, price rises or capex, so edit the rows or add one-time events for those. Descriptions that do not match a known category are grouped by their first words, so check that nothing was split or merged wrongly.</p>`, false);
  return p;
}

/* ---------- state, compute, render ---------- */

function refresh() {

}
function drawPrev() {

}

    const ms = String(f.months || 'all').trim().toLowerCase(), occ = (ms === 'all' || ms === '') ? 12 : ms.split(/[ ,]+/).filter(Boolean).length;
