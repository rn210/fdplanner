<div class="wrap">
  <header>
    <p class="eyebrow">Treasury desk · fixed deposit ladder</p>
    <h1>FD Ladder Planner</h1>
    <p class="lede">Reads the cash forecast, finds the lowest stressed balance inside every holding window, and ladders surplus cash into the best-paying deposits that never touch the safety buffer.</p>
  </header>
  <section id="summary" class="summary" aria-live="polite"></section>
  <noscript><div class="note warn">This planner runs in your web browser and needs JavaScript. Open the file in Chrome, Edge or Firefox. File previews that block scripts show only this header.</div></noscript>
  <div id="boot"></div>
  <div id="gap"></div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="b-plan" data-tab="plan" aria-selected="true">FD plan</button>
    <button role="tab" id="b-inputs" data-tab="inputs" aria-selected="false">Inputs</button>
    <button role="tab" id="b-validation" data-tab="validation" aria-selected="false">Validation</button>
  </nav>
  <main>
    <div id="tab-plan" class="panel"></div>
    <div id="tab-inputs" class="panel" hidden></div>
    <div id="tab-validation" class="panel" hidden></div>
  </main>
  <input type="file" id="impFile" accept=".xlsx,.xls,.xlsm,.ods,.csv,.tsv,.txt" hidden>
</div>
<script>
'use strict';
const DAY = 86400000;
const KEY = 'fdladder.v1';
const parseISO = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || '')); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN; };
const isoOf = (ms) => new Date(ms).toISOString().slice(0, 10);
const fmtDate = (ms) => new Date(ms).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
const fL = (x) => { const a = Math.abs(x), s = x < 0 ? '−' : ''; return a >= 100 ? s + '₹' + (a / 100).toFixed(2) + ' Cr' : s + '₹' + a.toFixed(1) + ' L'; };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function EXAMPLE() {
  const fd = (days, rate) => ({ on: true, provider: 'ICICI Bank', type: 'FD', days, rate, pen: 1 });
  const tb = (days, rate) => ({ on: false, provider: 'Govt of India T-Bills', type: 'TBILL', days, rate, pen: 0.1 });
  return {
    startDate: '2026-10-14', opening: 1000, buffer: 40, planDays: 365, scenario: 'stress', delay: 0,
    review: 15, minTicket: 5, lot: 1, tax: 25.17,
    providers: [{ name: 'ICICI Bank', cap: 0 }, { name: 'Govt of India T-Bills', cap: 0 }],
    fds: [{ label: 'Existing FD', provider: 'ICICI Bank', amt: 100, rate: 6, start: '2026-07-14', mat: '2027-01-14' }],
    flows: [
      { name: 'Operating outflows (salaries, admin, vendors)', type: 'out', amt: 30, pct: 20, days: 'last2', conc: 80, months: 'all' },
      { name: 'Customer receipts', type: 'in', amt: 10, pct: 20, days: '12-18', conc: 80, months: 'all' }
    ],
    inst: [fd(30, 4.5), fd(60, 4.75), fd(91, 5.25), fd(120, 5.5), fd(185, 5.75), fd(271, 6.0), fd(365, 6.25), fd(540, 6.5),
      tb(91, 5.5747), tb(182, 6.0999), tb(364, 6.2869)]
  };
}
const STAT_ROWS = () => [
  { name: 'GST payment (GSTR-3B)', type: 'out', amt: 8, pct: 20, days: '20', conc: 100, months: 'all' },
  { name: 'TDS deposit', type: 'out', amt: 3, pct: 10, days: '7', conc: 100, months: 'all' },
  { name: 'PF / EPFO', type: 'out', amt: 2.5, pct: 5, days: '15', conc: 100, months: 'all' },
  { name: 'Advance tax instalment', type: 'out', amt: 25, pct: 10, days: '15', conc: 100, months: '3,6,9,12' },
  { name: 'Capex and events', type: 'out', amt: 15, pct: 30, days: '20-28', conc: 70, months: '2,5,8,11' }
];

/* ---------- calendar and events ---------- */
function buildCal(S) {
  const s = parseISO(S.startDate); const sd = new Date(s);
  const first = Date.UTC(sd.getUTCFullYear(), sd.getUTCMonth(), 1);
  const off = Math.round((s - first) / DAY);
  const maxT = Math.max(30, ...S.inst.filter((i) => i.on && +i.days > 0).map((i) => Math.min(1100, +i.days)));
  const N = S.planDays + maxT + 2, M = off + N + 45;
  const y0 = sd.getUTCFullYear(), m0 = sd.getUTCMonth();
  const cal = { s, first, off, N, M, m: [], d: [], dim: [], mk: [], wd: [], blocks: {} };
  for (let i = 0; i < M; i++) {
    const dt = new Date(first + i * DAY), y = dt.getUTCFullYear(), m = dt.getUTCMonth(), dow = dt.getUTCDay();
    cal.m[i] = m; cal.d[i] = dt.getUTCDate(); cal.dim[i] = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    cal.mk[i] = (y - y0) * 12 + (m - m0); cal.wd[i] = dow > 0 && dow < 6;
    (cal.blocks[cal.mk[i]] || (cal.blocks[cal.mk[i]] = [])).push(i);
  }
  return cal;
}
const isoTok = (t) => /^\d{4}-\d{2}-\d{2}$/.test(t);
/* A flow is one-time when its freq says so; older rows marked a one-off by putting a date in Days. */
const isOnce = (f) => f.freq ? f.freq === 'once' : isoTok(String(f.days || '').trim());
const onceDate = (f) => f.date || (isoTok(String(f.days || '').trim()) ? String(f.days).trim() : '');
function buildEvents(S, cal) {
  return S.flows.map((f) => {
    const ev = [], toks = String(f.days || '').split(',').map((x) => x.trim()).filter(Boolean);
    const conc = Math.min(100, Math.max(0, +f.conc || 0)) / 100;
    const ms = String(f.months || 'all').trim().toLowerCase();
    const mset = (ms === 'all' || ms === '') ? null : new Set(ms.split(/[ ,]+/).map(Number));
    const push = (i, w, mk) => { const t = i - cal.off; if (t >= 0 && t < cal.N && w > 0) ev.push({ t, w, mk }); };
    const once = isOnce(f), isos = once ? [onceDate(f)].filter(isoTok) : toks.filter(isoTok);
    if (once || isos.length) {
      isos.forEach((t) => { const i = Math.round((parseISO(t) - cal.first) / DAY); if (i >= 0 && i < cal.M) push(i, 1, cal.mk[i]); });
    } else {
      const maxMk = cal.mk[cal.M - 1];
      for (let k = 0; k <= maxMk; k++) {
        const blk = cal.blocks[k]; if (!blk || !blk.length) continue;
        if (mset && !mset.has(cal.m[blk[0]] + 1)) continue;
        const wds = blk.filter((i) => cal.wd[i]); if (!wds.length) continue;
        const dim = cal.dim[blk[0]], tg = new Set();
        toks.forEach((tok) => {
          let mt;
          if ((mt = tok.match(/^last(\d*)$/i))) { wds.slice(-Math.max(1, +mt[1] || 1)).forEach((i) => tg.add(i)); }
          else if ((mt = tok.match(/^(\d+)\s*-\s*(\d+)$/))) {
            const a = +mt[1], b = +mt[2], sel = wds.filter((i) => cal.d[i] >= a && cal.d[i] <= b);
            if (sel.length) sel.forEach((i) => tg.add(i)); else tg.add(wds.find((i) => cal.d[i] >= a) || wds[wds.length - 1]);
          } else if (/^\d+$/.test(tok)) {
            let i = blk[Math.min(+tok, dim) - 1]; while (i < cal.M && !cal.wd[i]) i++; if (i < cal.M) tg.add(i);
          }
        });
        const tl = [...tg], c = tl.length ? conc : 0, wm = new Map();
        tl.forEach((i) => wm.set(i, (wm.get(i) || 0) + c / tl.length));
        wds.forEach((i) => wm.set(i, (wm.get(i) || 0) + (1 - c) / wds.length));
        wm.forEach((w, i) => push(i, w, k));
      }
    }
    return { f, ev };
  });
}
function specFor(name, S) {
  if (name === 'base') return { outFac: () => 1, inFac: () => 1, delay: 0 };
  if (name === 'opt') return { outFac: (p) => 1 - p, inFac: (p) => 1 + p, delay: 0 };
  return { outFac: (p) => 1 + p, inFac: (p) => 1 - p, delay: Math.max(0, Math.round(+S.delay || 0)) };
}
function flowsFor(evs, spec, N) {
  const inF = new Float64Array(N), outF = new Float64Array(N);
  evs.forEach((c) => {
    const f = c.f, pct = (+f.pct || 0) / 100, amt = +f.amt || 0, isOut = f.type === 'out';
    const fac = isOut ? spec.outFac(pct) : spec.inFac(pct), arr = isOut ? outF : inF, sh = isOut ? 0 : (spec.delay || 0);
    for (const e of c.ev) { const t = e.t + sh; if (t >= 0 && t < N) arr[t] += amt * e.w * fac; }
  });
  (spec.extra || []).forEach((x) => { if (x.t >= 0 && x.t < N) (x.type === 'in' ? inF : outF)[x.t] += x.amt; });
  return { inF, outF };
}
function existingMat(S, cal) {
  const mat = new Float64Array(cal.N);
  S.fds.forEach((f) => {
    f.t = null; f.val = null;
    const st = parseISO(f.start), mt = parseISO(f.mat); if (!isFinite(st) || !isFinite(mt)) return;
    const T = Math.max(1, Math.round((mt - st) / DAY));
    f.val = (+f.amt || 0) * Math.pow(1 + (+f.rate || 0) / 400, 4 * T / 365);
    f.t = Math.round((mt - cal.s) / DAY);
    if (f.t >= 0 && f.t < cal.N) mat[f.t] += f.val;
  });
  return mat;
}
function basePath(S, sc, mat) {
  const N = sc.inF.length, S0 = new Float64Array(N), dip0 = new Float64Array(N); let prev = +S.opening || 0;
  for (let t = 0; t < N; t++) { const d = prev + mat[t] - sc.outF[t]; dip0[t] = d; prev = d + sc.inF[t]; S0[t] = prev; }
  return { S0, dip0 };
}

/* ---------- instruments and planner ---------- */
const growth = (i, T) => i.type === 'TBILL' ? 1 + i.rate / 100 * T / 365 : Math.pow(1 + i.rate / 400, 4 * T / 365);
function activeInsts(S, rows) {
  return (rows || S.inst.filter((i) => i.on)).filter((i) => +i.days > 0 && +i.rate > 0).map((i) => {
    const days = Math.min(1100, Math.round(+i.days)), o = { provider: i.provider, type: i.type, days, rate: +i.rate, pen: +i.pen || 0 };
    o.ey = Math.pow(growth(o, days), 365 / days) - 1; o.name = i.provider + ' · ' + days + 'd'; return o;
  }).sort((a, b) => b.ey - a.ey || a.days - b.days);
}
function mkFD(cal, ins, d, x) {
  const g = growth(ins, ins.days);
  return { d, m: d + ins.days, T: ins.days, amt: x, gain: x * (g - 1), ins, rate: ins.rate, prov: ins.provider,
    date: cal.s + d * DAY, mDate: cal.s + (d + ins.days) * DAY };
}
const accr = (f, H) => f.gain * Math.min(f.T, Math.max(0, H - f.d)) / f.T;
function planFDs(S, cal, base, insts) {
  const N = cal.N, H = S.planDays, dip = Float64Array.from(base.dip0), expo = {}, cap = {}, res = [], pending = new Set();
  S.providers.forEach((p) => { cap[p.name] = +p.cap || 0; });
  const ex = (p) => expo[p] || (expo[p] = new Float64Array(N));
  const wd = (d) => cal.wd[d + cal.off];
  const nextWD = (d) => { while (d < N && !wd(d)) d++; return d; };
  S.fds.forEach((f) => {
    if (f.t == null || !isFinite(f.t)) return;
    const st = Math.max(0, Math.round((parseISO(f.start) - cal.s) / DAY)), e = ex(f.provider);
    for (let i = st; i < Math.min(f.t, N); i++) e[i] += +f.amt || 0;
    if (f.t >= 0 && f.t < H) pending.add(nextWD(f.t));
  });
  let last = -1e9;
  for (let d = 0; d < H; d++) {
    if (!wd(d)) continue;
    if (!(pending.has(d) || d - last >= S.review)) continue;
    last = d;
    for (const ins of insts) {
      const m = d + ins.days; if (m >= N) continue;
      let mn = Infinity, mt = d;
      for (let t = d; t < m; t++) if (dip[t] < mn) { mn = dip[t]; mt = t; }
      let L = mn - S.buffer, why = { kind: 'dip', t: mt };
      const c = cap[ins.provider];
      if (c > 0) { const e = ex(ins.provider); let mx = 0; for (let t = d; t < m; t++) if (e[t] > mx) mx = e[t]; if (c - mx < L) { L = c - mx; why = { kind: 'cap' }; } }
      const x = Math.floor(L / S.lot + 1e-9) * S.lot;
      if (!(x >= S.minTicket)) continue;
      const f = mkFD(cal, ins, d, x); f.why = why; res.push(f);
      const e = ex(ins.provider);
      for (let t = d; t < m; t++) { dip[t] -= x; e[t] += x; }
      for (let t = m; t < N; t++) dip[t] += f.gain;
      if (m < H) pending.add(nextWD(m));
    }
  }

function parseCSV(text) {

  if (info.scaled) notes.push(`${plural(info.scaled, 'weekly, fortnightly or daily row')} converted to a monthly amount spread over working days.`);
  if (info.yearGuess) notes.push(`${plural(info.yearGuess, 'yearly row')} had no date, so March was assumed.`);
  if (info.skipped) notes.push(`${plural(info.skipped, 'row')} skipped (totals, balances, headings or blank amounts).`);
  if (impMode.flows === 'add') notes.push('Added to the existing rows. If the file already covers an existing row, remove one of them so nothing is counted twice.');
  const how = G ? `month-by-month forecast on sheet “${esc(G.sheet)}” (${G.cols.length} month columns)` : `sheet “${esc(T.sheet)}”`;
  return { ok: true, warn: past > 0 || info.noDate > 0, html: `<b>${impMode.flows === 'add' ? 'Added' : 'Imported'} ${plural(out.length, 'row')} from ${how}:</b> ${info.monthly} monthly, ${info.once} one-time. Amounts read as ${info.unit}.${T ? mapList(T, FLOW_NAMES) : ''}${notes.map((s) => '<p>' + s + '</p>').join('')}` };
}
async function handleImport(file) {
  const what = impWhat; if (!file || !what) return;
  impMsg[what] = { cls: '', html: 'Reading ' + esc(file.name) + '…' }; buildInputs();
  try {
    const sheets = await readSheets(file), snap = JSON.stringify(S);
    const res = what === 'cash' ? importCash(sheets) : what === 'fds' ? importFDs(sheets) : importFlows(sheets);
    if (res.ok) impUndo = { what, snap };
    impMsg[what] = { cls: res.ok && !res.warn ? '' : 'warn', html: '<span class="small">' + esc(file.name) + '</span><br>' + res.html };
  } catch (e) {
    impMsg[what] = { cls: 'warn', html: e && e.message === 'load'
      ? 'The Excel reader could not be loaded. It is fetched from cdnjs.cloudflare.com the first time you import, so check the internet connection, or save the sheet as CSV and import that.'
      : 'Could not read ' + esc(file.name) + '. ' + esc(e && e.message || '') };
  }
  buildInputs(); refresh();
}
async function downloadTemplate(what) {
  const X = await loadXLSX();
  const D = (iso) => { const m = parseISO(iso); if (!isFinite(m)) return null; const d = new Date(m); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
  let rows, sheet;
  if (what === 'cash') {
    sheet = 'Cash position';
    rows = [['Item', 'Value'], ['As of date', D(S.startDate)], ['Current account balance (₹ lakh)', S.opening], ['Safety buffer (₹ lakh)', S.buffer],
      ['Planning horizon (days)', S.planDays], ['Review every (days)', S.review], ['Smallest deposit (₹ lakh)', S.minTicket], ['Deposit rounding (₹ lakh)', S.lot],
      ['Tax on interest (%)', S.tax], ['Receipts late by (days), stress', S.delay]];
  } else if (what === 'fds') {
    sheet = 'Existing FDs';
    rows = [['FD number', 'Bank', 'Principal (₹ lakh)', 'Rate % p.a.', 'Start date', 'Maturity date']].concat(S.fds.map((f) => [f.label, f.provider, f.amt, f.rate, D(f.start), D(f.mat)]));
  } else {
    sheet = 'Inflows and outflows';
    rows = [['Event', 'Type', 'Repeats', 'Amount (₹ lakh)', '± %', 'Days', 'Concentrated %', 'Months', 'Date (one-time)']].concat(S.flows.map((f) => isOnce(f)
      ? [f.name, f.type === 'in' ? 'Inflow' : 'Outflow', 'One time', f.amt, f.pct, null, null, null, D(onceDate(f))]
      : [f.name, f.type === 'in' ? 'Inflow' : 'Outflow', 'Monthly', f.amt, f.pct, f.days, f.conc, f.months, null]));
  }
  const ws = X.utils.aoa_to_sheet(rows, { cellDates: true, dateNF: 'yyyy-mm-dd' }), wb = X.utils.book_new();
  ws['!cols'] = rows[0].map((h, i) => ({ wch: i === 0 ? 36 : 16 }));
  X.utils.book_append_sheet(wb, ws, sheet);
  X.writeFile(wb, 'FD planner - ' + sheet.toLowerCase() + '.xlsx');
}

/* ---------- state, compute, render ---------- */
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
function load() { try { const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j && j.flows && j.inst && j.fds && j.providers) S = Object.assign(EXAMPLE(), j); } catch (e) { /* ignore */ } }
function refresh() {
  const ae = document.activeElement, keep = ae && ae.id && ae.closest && ae.closest('#tab-validation') ? ae.id : null;
  M = computeModel(S); renderSummary(M); renderTab(); save();
  if (keep && $(keep)) { const n = $(keep); n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) { /* not a text field */ } }
}
function drawPrev() {
  const el = $('chPrev'); if (!el || !M) return;
  cashChart(el, M, true, 210); $('prevCap').innerHTML = fdCaption(M);
}
function renderTab() {
  if (!M) return;
  if (tab === 'plan') renderPlan(M); else if (tab === 'validation') renderValidation(M); else if (tab === 'inputs') drawPrev();
}
function schedule() { clearTimeout(timer); timer = setTimeout(refresh, 140); }
function showTab(t) {
  tab = t;
  ['plan', 'inputs', 'validation'].forEach((k) => { $('tab-' + k).hidden = k !== t; $('b-' + k).setAttribute('aria-selected', k === t ? 'true' : 'false'); });
  if (t === 'inputs' && !$('tab-inputs').firstChild) buildInputs();
  renderTab();
  try { history.replaceState(null, '', '#' + t); } catch (e) { /* ignore */ }
}
function bufMonth() {
  let tot = 0;
  S.flows.forEach((f) => {
    if (f.type !== 'out' || isOnce(f) || /\d{4}-\d{2}-\d{2}/.test(f.days)) return;
    const ms = String(f.months || 'all').trim().toLowerCase(), occ = (ms === 'all' || ms === '') ? 12 : ms.split(/[ ,]+/).filter(Boolean).length;
    tot += (+f.amt || 0) * (1 + (+f.pct || 0) / 100) * occ / 12;
  });
  S.buffer = Math.round(tot * 10) / 10;
}
function onField(e) {
  const el = e.target, t = el.dataset.t;
  if (el.id === 'impFile') { if (e.type === 'change') handleImport(el.files && el.files[0]); return; }
  if (el.dataset.imode) { impMode[el.dataset.imode] = el.value; return; }
  if (!t) return;
  const i = +el.dataset.i, k = el.dataset.k;
  let v = el.type === 'checkbox' ? el.checked : (el.dataset.n ? (parseFloat(el.value) || 0) : el.value);
  if (t === 'S') S[k] = v; else S[t][i][k] = v;
  if (t === 'flows' && k === 'freq') {
    const f = S.flows[i], d = String(f.days || '').trim();
    if (v === 'once' && !isoTok(f.date || '')) f.date = isoTok(d) ? d : S.startDate;
    if (v === 'monthly' && isoTok(d)) f.days = '15';
    if (e.type === 'change') buildInputs();
  }
  schedule();
}
function onClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { showTab(b.dataset.tab); return; }
  const a = b.dataset.act; if (!a) return;
  const prov = S.providers[0] ? S.providers[0].name : 'ICICI Bank';
  if (a === 'csv') {
    const txt = csvOf(M), msg = $('csvmsg');
    const fallback = () => { $('csvbox').innerHTML = '<textarea class="csv" readonly id="csvta" aria-label="Plan as CSV"></textarea>'; const ta = $('csvta'); ta.value = txt; ta.focus(); ta.select(); msg.textContent = 'Copy the text below.'; };
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = 'Copied.'; }, fallback); } catch (err) { fallback(); }
    return;
  }
  if (a === 'imp') { impWhat = b.dataset.what; const fi = $('impFile'); fi.value = ''; fi.click(); return; }
  if (a === 'tpl') {
    const w = b.dataset.what;
    downloadTemplate(w).catch(() => { impMsg[w] = { cls: 'warn', html: 'The Excel writer could not be loaded from cdnjs.cloudflare.com. Check the internet connection and try again.' }; buildInputs(); });
    return;
  }
  if (a === 'undo') {
    if (impUndo) { S = Object.assign(EXAMPLE(), JSON.parse(impUndo.snap)); impMsg[impUndo.what] = { cls: '', html: 'Import undone. The table is back to how it was.' }; impUndo = null; }
    buildInputs(); refresh(); return;
  }
  if (a === 'reset') { S = EXAMPLE(); impUndo = null; Object.keys(impMsg).forEach((k) => delete impMsg[k]); buildInputs(); refresh(); return; }
  if (a === 'bufmonth') { bufMonth(); buildInputs(); refresh(); return; }
  if (a === 'del') { S[b.dataset.t].splice(+b.dataset.i, 1); }
  else if (a === 'addfd') S.fds.push({ label: 'FD', provider: prov, amt: 50, rate: 6.5, start: S.startDate, mat: isoOf(parseISO(S.startDate) + 180 * DAY) });
  else if (a === 'addflow') S.flows.push({ name: 'New event', type: 'out', freq: 'monthly', amt: 5, pct: 10, days: '15', conc: 100, months: 'all' });
  else if (a === 'addonce') S.flows.push({ name: 'One-time event', type: 'out', freq: 'once', date: isoOf(parseISO(S.startDate) + 30 * DAY), amt: 50, pct: 0, days: '', conc: 100, months: 'all' });
  else if (a === 'addstat') S.flows.push(...STAT_ROWS());
  else if (a === 'addinst') S.inst.push({ on: true, provider: prov, type: 'FD', days: 180, rate: 6, pen: 1 });
  else if (a === 'addprov') {
    const n = $('newProv').value.trim();
    if (n && !S.providers.some((p) => p.name === n)) S.providers.push({ name: n, cap: 0 });
  }
  buildInputs(); refresh();
}
let rz = null;
function init() {
  load();
  document.addEventListener('input', onField); document.addEventListener('change', onField); document.addEventListener('click', onClick);
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { renderTab(); }, 150); });
  const h = (location.hash || '').replace('#', '');
  try { buildInputs(); M = computeModel(S); renderSummary(M); }
  catch (e) {
    /* Saved inputs this version cannot read: start from the example rather than a blank page. */
    S = EXAMPLE(); buildInputs(); M = computeModel(S); renderSummary(M);
    $('boot').innerHTML = `<div class="note warn">Your saved inputs could not be loaded (${esc(e && e.message)}), so the example data is shown. Re-enter or re-import your figures in Inputs.</div>`;
  }
  showTab(['plan', 'inputs', 'validation'].includes(h) ? h : 'plan');
}
if (typeof document !== 'undefined') init();

</script>
